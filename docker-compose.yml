services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  metrics-service:
    build: .
    depends_on:
      - redis
    command: ["uvicorn", "src.metrics_service:app", "--host", "0.0.0.0", "--port", "8001", "--log-level", "warning", "--no-access-log"]
    environment:
      PYTHONPATH: /app
    ports:
      - "8001:8001"

  response-service:
    build: .
    depends_on:
      - redis
    command: ["uvicorn", "src.response_service:app", "--host", "0.0.0.0", "--port", "8002", "--log-level", "warning", "--no-access-log"]
    environment:
      PYTHONPATH: /app
      REDIS_URL: redis://redis:6379/0
      METRICS_SERVICE_URL: http://metrics-service:8001
    volumes:
      - dataset:/app/dataset
    ports:
      - "8002:8002"

  cache-service:
    build: .
    depends_on:
      - redis
      - response-service
      - metrics-service
    command: ["uvicorn", "src.cache_service:app", "--host", "0.0.0.0", "--port", "8000", "--log-level", "warning", "--no-access-log"]
    environment:
      PYTHONPATH: /app
      REDIS_URL: redis://redis:6379/0
      RESPONSE_SERVICE_URL: http://response-service:8002
      METRICS_SERVICE_URL: http://metrics-service:8001
      CACHE_TTL: "120"
    ports:
      - "8000:8000"

  consumer:
    build: .
    depends_on:
      - kafka
      - redis
      - response-service
      - metrics-service
    command: ["python", "-m", "src.consumer"]
    environment:
      PYTHONPATH: /app
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_URL: redis://redis:6379/0
      RESPONSE_SERVICE_URL: http://response-service:8002
      METRICS_SERVICE_URL: http://metrics-service:8001
      KAFKA_TOPIC: queries
      RETRY_TOPIC: queries_retry
      DLQ_TOPIC: queries_dlq
      CONSUMER_GROUP: query_consumers
      MAX_RETRIES: "3"
      CACHE_TTL: "120"

  producer:
    build: .
    depends_on:
      - kafka
    command: ["python", "-m", "src.producer"]
    environment:
      PYTHONPATH: /app
      KAFKA_BROKER: kafka:9092
      KAFKA_TOPIC_QUERIES: queries

  traffic-generator:
    build: .
    depends_on:
      - kafka
    command: ["python", "-m", "src.traffic_generator_kafka", "--requests", "200", "--distribution", "uniform"]
    environment:
      PYTHONPATH: /app
      KAFKA_BROKER: kafka:9092
      KAFKA_TOPIC_QUERIES: queries

volumes:
  dataset: